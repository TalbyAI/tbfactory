name: Formatting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: formatting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            prototypes/durable-workflow-storage/package-lock.json

      - name: Install application formatting tools
        run: npm ci

      - name: Check application and documentation formatting
        run: npm run format:check

      - name: Install prototype formatting tools
        working-directory: prototypes/durable-workflow-storage
        run: npm ci

      - name: Check prototype formatting
        working-directory: prototypes/durable-workflow-storage
        run: npm run format:check
